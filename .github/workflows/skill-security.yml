name: Skill security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 07:00 UTC, before the update check.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan vendored skills
        run: python3 scripts/scan_skills.py
